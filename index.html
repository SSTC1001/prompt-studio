<style>
:root{--bg:#f6f4ef;--card:#ffffff;--ink:#1b1a17;--mute:#77736a;--line:#e6e2d8;--acc:#d9481c;--accSoft:#fbe9e2;--sel:#1b1a17;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-family:'Lora',Georgia,serif;font-size:22px;font-weight:700;letter-spacing:-.5px}
.logo span{color:var(--acc)}
.link{background:none;border:0;color:var(--mute);font:600 13px 'DM Sans',system-ui,sans-serif;cursor:pointer;padding:6px}
h1{font-family:'Lora',Georgia,serif;font-size:clamp(28px,7vw,40px);line-height:1.1;margin:8px 0 6px;letter-spacing:-.8px}
.sub{color:var(--mute);margin:0 0 22px;font-size:15px}
/* kategori */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.cats{grid-template-columns:repeat(3,1fr)}}

.pill.on{background:var(--sel);border-color:var(--sel);color:#fff}

.extra{margin-top:10px;font-size:14px!important;padding:9px 12px!important}

.why{display:none}.q.open .why{display:block}

 w.innerHTML=`<label>${esc(q.l)}${q.w?'<button class="wq" type="button">Neden?</button>':""}</label>`+(q.w?`<div class="why">${esc(q.w)}</div>`:"")+(q.p&&q.t!=="text"&&q.t!=="textarea"?`<div class="help">${esc(q.p)}</div>`:"");
 const wq=w.querySelector(".wq");if(wq)wq.onclick=()=>w.classList.toggle("open");
 if(q.t==="text"||q.t==="textarea"){const e=document.createElement(q.t==="text"?"input":"textarea");if(q.t==="text")e.type="text";
  e.placeholder=q.p||"Yaz...";e.value=S.v[key]||"";e.oninput=()=>S.v[key]=e.value;w.appendChild(e);micBtn(e,w)}
 else if(q.t==="select"||q.t==="chips"){const single=q.t==="select",d=document.createElement("div");d.className="pills";
  if(!single)S.ch[key]=S.ch[key]||new Set();
  q.o.forEach(o=>{const b=document.createElement("button");b.className="pill"+(single?" single":"");b.textContent=o;
   const on=single?S.v[key]===o:S.ch[key].has(o);if(on)b.classList.add("on");
   b.onclick=()=>{if(single){S.v[key]=S.v[key]===o?"":o;d.querySelectorAll(".pill").forEach(x=>x.classList.toggle("on",x.textContent===S.v[key]))}
    else{S.ch[key].has(o)?S.ch[key].delete(o):S.ch[key].add(o);b.classList.toggle("on")}};d.appendChild(b)});
  w.appendChild(d);
  if(!single){const ex=document.createElement("input");ex.type="text";ex.className="extra";ex.placeholder="+ Listede yoksa kendin yaz";
   ex.value=S.v[key+"_ek"]||"";ex.oninput=()=>S.v[key+"_ek"]=ex.value;w.appendChild(ex);micBtn(ex,w)}}
 else if(q.t==="scale"){const d=document.createElement("div");d.className="scale";
  d.innerHTML=`<span class="ends">${esc(q.a)}</span><div class="dots"></div><span class="ends r">${esc(q.b)}</span>`;
  const dots=d.querySelector(".dots");[1,2,3,4,5].forEach(n=>{const b=document.createElement("button");b.className="dot"+(S.v[key]==n?" on":"");
   b.title=n;b.onclick=()=>{S.v[key]=S.v[key]==n?"":n;dots.querySelectorAll(".dot").forEach((x,i)=>x.classList.toggle("on",S.v[key]==i+1))};dots.appendChild(b)});
  w.appendChild(d)}
 else if(q.t==="palette"){const d=document.createElement("div");d.className="pals";
  PALETS.forEach(p=>{const b=document.createElement("button");b.className="pal"+(p.c?"":" txt")+(S.v[key]===p.n?" on":"");
   b.innerHTML=`<div class="sw">${p.c?p.c.map(c=>`<span style="background:${c}"></span>`).join(""):p.e}</div><b>${p.n}</b><small>${p.d}</small>`;
   b.onclick=()=>{S.v[key]=S.v[key]===p.n?"":p.n;d.querySelectorAll(".pal").forEach((x,i)=>x.classList.toggle("on",PALETS[i].n===S.v[key]))};d.appendChild(b)});
  w.appendChild(d)}
 return w;
}
function imgStep(card){
 card.innerHTML=`<div class="q"><label>Örnek görseller <span class="opt">isteğe bağlı</span></label><div class="help">İlham, kendi logon, fotoğrafların ya da "böyle olmasın" örnekleri. Her birine rol ver.</div>
 <div class="drop">📎 Görsel seç ya da sürükle bırak</div><input type="file" accept="image/*" multiple class="hide"><div class="thumbs"></div></div>
 <div class="q"><label>Görsel linkleri <span class="opt">her satıra bir</span></label><textarea placeholder="https://pinterest.com/..."></textarea></div>`;
 const dr=card.querySelector(".drop"),fi=card.querySelector("input[type=file]"),th=card.querySelector(".thumbs"),ta=card.querySelector("textarea");
 ta.value=S.links;ta.oninput=()=>S.links=ta.value;
 const draw=()=>{th.innerHTML="";S.images.forEach((im,i)=>{const d=document.createElement("div");d.className="thumb";
  d.innerHTML=`<img src="${im.src}"><button class="x">×</button><div class="n">Görsel ${i+1}</div>`;
  const se=document.createElement("select");se.innerHTML=ROLES.map(r=>`<option>${r}</option>`).join("");se.value=im.role;se.onchange=()=>im.role=se.value;
  const no=document.createElement("input");no.type="text";no.placeholder="Neyini beğendin?";no.value=im.note;no.oninput=()=>im.note=no.value;
  d.querySelector(".x").onclick=()=>{S.images.splice(i,1);draw()};d.append(se,no);th.appendChild(d)})};
 const add=fs=>[...fs].forEach(f=>{if(!f.type.startsWith("image/"))return;const r=new FileReader();r.onload=e=>{S.images.push({name:f.name,src:e.target.result,role:ROLES[0],note:""});draw()};r.readAsDataURL(f)});
 dr.onclick=()=>fi.click();fi.onchange=()=>{add(fi.files);fi.value=""};
 dr.ondragover=e=>{e.preventDefault();dr.classList.add("over")};dr.ondragleave=()=>dr.classList.remove("over");
 dr.ondrop=e=>{e.preventDefault();dr.classList.remove("over");add(e.dataTransfer.files)};draw();
}
function skillStep(card){
 const rec=CATS[S.cat].skills;card.innerHTML=`<div class="help" style="margin:0">Bu işe önerilenler en üstte. Dokunarak ekle ya da çıkar.</div>`;
 const mk=k=>{const b=document.createElement("button");b.className="sk"+(S.skills.has(k)?" on":"");
  b.innerHTML=`<span class="bx">✓</span><span><b>${k}</b><span>${SKILLS[k]||""}</span></span>${rec.includes(k)?'<span class="rec">Önerilen</span>':""}`;
  b.onclick=()=>{S.skills.has(k)?S.skills.delete(k):S.skills.add(k);b.classList.toggle("on")};return b};
 const g=(t,list)=>{if(!list.length)return;const h=document.createElement("div");h.className="grp";h.textContent=t;card.appendChild(h);
  const w=document.createElement("div");w.className="skills";list.forEach(k=>w.appendChild(mk(k)));card.appendChild(w)};
 g("Bu iş için önerilen",rec);
 Object.entries(SKGRP).forEach(([t,l])=>g(t,l.filter(k=>!rec.includes(k))));
}
function show(){save();
 const st=steps(),n=st.length;$("#restart").classList.remove("hide");$("#nav").classList.remove("hide");
 if(S.i>=n)return result();
 const cur=st[S.i],title=cur==="IMG"?"Örnek görseller":cur==="SKILL"?"Kullanılacak skill'ler":cur[0];
 app.innerHTML=`<div class="stepper">${st.map((_,i)=>`<i class="${i<S.i?"done":i===S.i?"now":""}" data-i="${i}"></i>`).join("")}<i data-i="${n}"></i></div>
 <div class="meta"><span>${CATS[S.cat].i} ${CATS[S.cat].n}</span><span>${S.i+1>=n-2?"Son adımlar":"Bölüm "+(S.i+1)+" · kalan "+(n-S.i)}</span></div>
 <h1>${esc(title)}</h1><p class="sub">${cur==="IMG"||cur==="SKILL"?"":qsOf(cur).length+" soru · "}Boş bıraktıkların prompta girmez, istediğini atla.</p><div class="card"></div>`;
 app.querySelectorAll(".stepper i").forEach(x=>x.onclick=()=>{S.i=+x.dataset.i;show()});
 const card=app.querySelector(".card");
 if(cur==="IMG")imgStep(card);else if(cur==="SKILL")skillStep(card);
 else{qsOf(cur).forEach(q=>card.appendChild(field(q,S.cat+"|"+(q._t||cur[0])+"|"+q.id)))}
 $("#back").textContent=S.i===0?"← Kategoriler":"← Geri";
 if(!V.on&&!$("#vmini")){const m=document.createElement("button");m.id="vmini";m.textContent="🎙️";m.title="Sesli devam et";document.body.appendChild(m);m.onclick=()=>{m.remove();V.on=true;V.qi=0;vLoop()}}
 if(V.on&&$("#vmini"))$("#vmini").remove();
 $("#next").textContent=S.i===n-1?"Promptu oluştur ✦":"İleri →";$("#next").className="btn "+(S.i===n-1?"acc":"pri");
 window.scrollTo({top:0,behavior:"smooth"});
}

function lum(h){const v=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2]}
function kont(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function metinCift(c){let best=null;c.forEach(z=>c.forEach(m=>{if(z===m)return;const r=kont(z,m);if(!best||r>best.r)best={z,m,r}}));return best}
function pick(a,seed){return a[Math.abs(seed)%a.length]}

 st.forEach(x=>{if(Array.isArray(x))qsOf(x).forEach(q=>{if(!all[q.id])all[q.id]={q,t:x[0]}})});

 if(all.qr)add(all.qr.q,all.qr.t);

 chatSay(h);chatSpeak(q.l);$("#cin").placeholder=q.t==="text"||q.t==="textarea"?"Yaz ya da 🎙'a bas…":"Seçeneklere dokun ya da kendin yaz…";
 if(q.t==="select")q.o.forEach(x=>{const b=document.createElement("button");b.className="chip";b.textContent=x;b.onclick=()=>{S.v[it.key]=x;chatSay(esc(x),"me");chatNext()};o.appendChild(b)});
 if(q.t==="scale")[1,2,3,4,5].forEach(n=>{const lab=["Çok "+q.a,"Biraz "+q.a,"Ortada","Biraz "+q.b,"Çok "+q.b][n-1];const b=document.createElement("button");b.className="chip";b.textContent=lab;b.onclick=()=>{S.v[it.key]=n;chatSay(esc(lab),"me");chatNext()};o.appendChild(b)});
 if(q.t==="palette")PALETS.forEach(p=>{const b=document.createElement("button");b.className="chip pal";b.innerHTML=(p.c?p.c.map(c=>`<i style="background:${c}"></i>`).join(""):(p.e||""))+" "+esc(p.n);b.onclick=()=>{S.v[it.key]=p.n;chatSay(b.innerHTML,"me");chatNext()};o.appendChild(b)});
 if(q.t==="chips"){S.ch[it.key]=S.ch[it.key]||new Set();const set=S.ch[it.key];
  const hb=document.createElement("button");hb.className="chip";hb.textContent="Hepsi";hb.onclick=()=>{const on=set.size<q.o.length;o.querySelectorAll(".chip.opt").forEach((b,i)=>{on?set.add(q.o[i]):set.delete(q.o[i]);b.classList.toggle("on",on)})};o.appendChild(hb);
  q.o.forEach(x=>{const b=document.createElement("button");b.className="chip opt"+(set.has(x)?" on":"");b.textContent=x;b.onclick=()=>{set.has(x)?set.delete(x):set.add(x);b.classList.toggle("on")};o.appendChild(b)});
  chatDone("Seçtiklerim tamam ✓",()=>{const ek=$("#cin").value.trim();if(ek)S.v[it.key+"_ek"]=ek;return [...set,ek].filter(Boolean).join(", ")})}}
function chatDone(lbl,fn){const b=document.createElement("button");b.className="chip done";b.textContent=lbl;b.onclick=()=>{const t=fn();if(!t){toast("Bir şey seç ya da Geç'e bas");return}chatSay(esc(t),"me");chatNext()};$("#copts").appendChild(b)}
function chatSend(t,skip){if(C.i<0){toast("Önce bir konu seç");return}const it=C.list[C.i];if(!it)return;t=(t||"").trim();
 if(skip||!t){if(!skip&&it.q&&it.q.t==="chips"&&S.ch[it.key]&&S.ch[it.key].size){$("#copts .done").click();return}chatSay("<i>geçtim</i>","me");chatNext();return}
 if(it.skill){chatSay(esc(t),"me");S.anlat=(S.anlat?S.anlat+"\n":"")+"- Skill notu: "+t;chatNext();return}
 const q=it.q;if(q.t==="chips"&&S.ch[it.key]&&S.ch[it.key].size){S.v[it.key+"_ek"]=t;chatSay(esc([...S.ch[it.key],t].join(", ")),"me");chatNext();return}
 const r=apply(q,it.key,t);if(r==null&&q.t!=="text"&&q.t!=="textarea"){S.anlat=(S.anlat?S.anlat+"\n":"")+"- "+q.l.replace(/\?$/,"")+": "+t}
 chatSay(esc(t),"me");chatNext()}
function chatBack(){if(C.i<=0){chatCat();return}C.i-=2;const ms=$("#clog").querySelectorAll(".msg");if(ms.length>=2){ms[ms.length-1].remove();ms[ms.length-2].remove()}chatNext()}

/* ---------- ELLER SERBEST SESLİ SORU-CEVAP (Whisper + sessizlik algılama) ---------- */
const H={on:false,paused:false,stream:null,ac:null,an:null,list:[],i:0,buf:""};
function hfList(k){const pc=S.cat,pm=S.mode;S.cat=k;S.mode="detay";const st=steps(),L=[],seen=new Set();
 const add=(q,t)=>{if(seen.has(q.id)||q.t==="scale"||SIRI_SKIP.includes(q.id))return;seen.add(q.id);L.push({q,key:k+"|"+(q._t||t)+"|"+q.id})};
 const first=st.find(x=>Array.isArray(x));if(first)qsOf(first).forEach(q=>add(q,first[0]));
 st.forEach(x=>{if(Array.isArray(x))qsOf(x).forEach(q=>{if(q.k)add(q,x[0])})});
 S.cat=pc;S.mode=pm;return L}
function hfText(q){let t=SIRI_TXT[q.id];
 if(!t){t=q.l.replace(/\s*\([^)]*\)/g,"").replace(/↔/g,"mı").trim();if(!/[?.]$/.test(t))t+=" ne olsun?"}
 else t=t.replace(/(Seçenekler|Örneğin):.*$/,"").trim();
 if((q.t==="select"||q.t==="chips")&&q.o)t+=" Örneğin: "+q.o.slice(0,4).join(", ")+".";
 if(q.t==="palette"&&!SIRI_TXT[q.id])t+=" Örneğin: "+PALETS.filter(p=>p.c).slice(0,4).map(p=>p.n).join(", ")+"; ya da kendi renklerini söyle.";
 return t}
function hfUI(){app.innerHTML=`<div class="hf"><div class="hfprog" id="hprog"></div><div class="hfq" id="hq">Hazırlanıyor…</div>
 <div class="hfst" id="hst"></div><div class="hflvl"><i id="hlvl"></i></div><div class="hfans" id="hans"></div><div class="hfex" id="hex"></div>
 <div class="hfbtns"><button class="btn sec" id="hpause">⏸ Duraklat</button><button class="btn sec" id="hskip">Geç →</button><button class="btn acc" id="hend">Bitir</button></div>
 <div class="help" style="margin-top:14px">Sesli komutlar: <b>geç</b> (soruyu atla), <b>geri</b> (önceki soru), <b>bitir</b>. Cevaptan sonra “başka var mı?” sorusuna <b>yok</b> de.</div></div>`;
 $("#hpause").onclick=()=>{H.paused=!H.paused;$("#hpause").textContent=H.paused?"▶ Devam":"⏸ Duraklat";if(!H.paused)hfLoop()};
 $("#hskip").onclick=()=>{H.skip=true};$("#hend").onclick=()=>hfFinish()}
function hfStat(t,cls){const e=$("#hst");if(e){e.textContent=t;e.className="hfst "+(cls||"")}}
function hfSay(t){return new Promise(r=>{hfStat("🔊 Okuyorum","konus");if(!window.speechSynthesis)return r();speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang="tr-TR";u.rate=1.02;const vs=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang));if(vs[0])u.voice=vs[0];
 let done=false;const fin=()=>{if(!done){done=true;setTimeout(r,250)}};u.onend=fin;u.onerror=fin;setTimeout(fin,1500+t.length*85);speechSynthesis.speak(u)})}
function hfRec(){return new Promise(res=>{
 const mt=["audio/webm","audio/mp4","audio/ogg"].find(t=>MediaRecorder.isTypeSupported(t))||"";
 const r=new MediaRecorder(H.stream,mt?{mimeType:mt}:{}),parts=[],buf=new Float32Array(H.an.fftSize);
 let t0=performance.now(),spoke=false,lastV=t0,floor=0,n=0,stopped=false;
 r.ondataavailable=e=>e.data.size&&parts.push(e.data);
 r.onstop=()=>res({blob:new Blob(parts,{type:r.mimeType||"audio/webm"}),spoke,type:r.mimeType||""});
 r.start(250);hfStat("🎙 Dinliyorum…","dinle");
 const tick=()=>{if(stopped)return;H.an.getFloatTimeDomainData(buf);let s=0;for(const x of buf)s+=x*x;const rms=Math.sqrt(s/buf.length),now=performance.now();
  if(now-t0<400){floor+=rms;n++}const thr=Math.max(.018,(n?floor/n:0)*2.8);
  const l=$("#hlvl");if(l)l.style.width=Math.min(100,rms*900)+"%";
  if(rms>thr){if(!spoke)hfStat("🎙 Dinliyorum… (bitince sus)","dinle on");spoke=true;lastV=now}
  const stop=H.skip||H.paused||!H.on||(spoke&&now-lastV>2200)||(!spoke&&now-t0>12000)||now-t0>90000;
  if(stop){stopped=true;r.stop();return}requestAnimationFrame(tick)};tick()})}
async function hfSTT(o){hfStat("✍️ Yazıya çeviriyorum","cevir");const key=localStorage.getItem("groq_key");
 const ext=o.type.includes("mp4")?"m4a":o.type.includes("ogg")?"ogg":"webm",fd=new FormData();
 fd.append("file",o.blob,"ses."+ext);fd.append("model","whisper-large-v3");fd.append("language","tr");fd.append("response_format","json");
 fd.append("prompt",(CATS[S.cat]?CATS[S.cat].n+". ":"")+"geç, geri, yok, tamam, bitir");
 const res=await fetch("https://api.groq.com/openai/v1/audio/transcriptions",{method:"POST",headers:{Authorization:"Bearer "+key},body:fd});
 if(res.status===401){localStorage.removeItem("groq_key");throw new Error("Anahtar geçersiz")}
 if(!res.ok)throw new Error("Groq hatası "+res.status);return ((await res.json()).text||"").trim()}
async function hfHear(){const o=await hfRec();if(!o.spoke||H.skip||H.paused||!H.on)return o.spoke?"":null;try{return await hfSTT(o)}catch(e){hfStat("⚠️ "+e.message,"err");await hfSay("Bir hata oldu: "+e.message);return null}}
const HF_NO=/^(yok|hayır|hayir|yok başka|başka yok|tamam|bu kadar|sıradaki|siradaki|devam|geçelim|o kadar)[.!]?$/i,HF_SKIP=/^(geç|gec|atla|pas|bilmiyorum|boş ver)[.!]?$/i,HF_BACK=/^(geri|önceki|geri dön)[.!]?$/i,HF_END=/^(bitir|bitti|prompt(u)? (oluştur|hazırla)|sonuca geç)[.!]?$/i;
async function hfStart(){
 let key="";try{key=localStorage.getItem("groq_key")||""}catch(e){}
 if(!key){app.innerHTML=`<h1>Sesli soru-cevap</h1><p class="sub">Konuşmanı doğru yazıya çevirmek için ücretsiz Groq anahtarı gerekiyor (bir kerelik). console.groq.com → API Keys → Create API Key. Anahtar sadece bu telefonda saklanır.</p><input type="text" id="gki" placeholder="gsk_..." autocomplete="off" style="width:100%"><div class="row" style="margin-top:10px"><button class="btn acc" id="gks">Kaydet ve başla</button></div>`;
  $("#gks").onclick=()=>{const v=$("#gki").value.trim();if(!/^gsk_/.test(v)){toast("Anahtar gsk_ ile başlamalı");return}localStorage.setItem("groq_key",v);hfStart()};return}
 if(!window.MediaRecorder){toast("Bu tarayıcı ses kaydını desteklemiyor");return}
 try{H.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){toast("Mikrofon izni gerekli");return}
 H.ac=new (window.AudioContext||window.webkitAudioContext)();await H.ac.resume();H.an=H.ac.createAnalyser();H.an.fftSize=2048;H.ac.createMediaStreamSource(H.stream).connect(H.an);
 if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(" ");u.lang="tr-TR";speechSynthesis.speak(u)}
 H.on=true;H.paused=false;S.mode="detay";$("#nav").classList.add("hide");$("#restart").classList.remove("hide");hfUI();
 if(!S.cat){$("#hq").textContent="Ne yapmak istiyorsun?";$("#hex").textContent=Object.values(CATS).map(c=>c.n).join(" · ");
  for(;;){if(!H.on)return;await hfSay("Merhaba. Ne yapmak istiyorsun? Örneğin sunum, afiş, logo, site ya da video.");const t=await hfHear();if(t==null)continue;
   const n=norm(t);const k=CATS[n]?n:Object.keys(CATKEY).find(c=>CATKEY[c].some(w=>n.includes(w)));
   if(k){S.cat=k;S.v={};S.ch={};S.anlat="";S.images=[];S.links="";S.skills=new Set(CATS[k].skills.slice(0,3));if(["sunum","site","uygulama","afis","logo","oyun","dashboard"].includes(k))S.skills.add("frontend-design");break}
   await hfSay("Anlayamadım, tekrar söyler misin?")}}
 H.list=hfList(S.cat);H.i=0;await hfSay(CATS[S.cat].n+". Toplam "+H.list.length+" soru var. Geçmek istediğinde geç de.");hfLoop()}
async function hfLoop(){if(H.busy)return;H.busy=true;
 try{while(H.on&&!H.paused&&H.i<H.list.length){const it=H.list[H.i];H.skip=false;H.buf="";
  $("#hprog").textContent=CATS[S.cat].i+" "+CATS[S.cat].n+" · Soru "+(H.i+1)+" / "+H.list.length;$("#hq").textContent=it.q.l;
  $("#hex").textContent=it.q.o?it.q.o.join(" · "):it.q.t==="palette"?PALETS.map(p=>p.n).join(" · "):(it.q.p||"");$("#hans").textContent="";
  await hfSay(hfText(it.q));let first=true,move=1;
  for(;;){if(!H.on||H.paused){H.busy=false;return}
   const t=await hfHear();if(H.skip){move=1;break}if(t==null){if(H.paused||!H.on){H.busy=false;return}await hfSay(first?"Seni duyamadım. Tekrar söyler misin? Atlamak için geç de.":"Başka eklemek istediğin var mı?");continue}
   const c=t.replace(/[.,!?]+$/,"").trim();
   if(HF_END.test(c)){hfApply(it);return hfFinish()}
   if(HF_BACK.test(c)){move=-1;break}
   if(first&&HF_SKIP.test(c)){move=1;break}
   if(!first&&(HF_NO.test(c)||HF_SKIP.test(c))){move=1;break}
   if(!c){continue}
   H.buf=(H.buf?H.buf+" ":"")+t;$("#hans").textContent=H.buf;first=false;
   await hfSay("Başka eklemek istediğin var mı?")}
  hfApply(it);H.i=Math.max(0,H.i+move);save()}
 if(H.on&&!H.paused&&H.i>=H.list.length){H.busy=false;await hfSay("Tamamdır, promptun hazır.");hfFinish()}}
 finally{H.busy=false}}
function hfApply(it){if(!H.buf)return;const q=it.q,t=H.buf;H.buf="";
 if(q.t==="text"||q.t==="textarea"){S.v[it.key]=t;return}
 const r=apply(q,it.key,t);if(r==null||/listede yoktu/.test(r||""))S.anlat=(S.anlat?S.anlat+"\n":"")+"- "+q.l.replace(/\?$/,"")+": "+t}
function hfFinish(){H.on=false;H.paused=false;try{speechSynthesis.cancel()}catch(e){}if(H.stream)H.stream.getTracks().forEach(t=>t.stop());try{H.ac&&H.ac.close()}catch(e){}
 if(!S.cat){home();return}S.siri=true;$("#nav").classList.remove("hide");result()}
</script>
